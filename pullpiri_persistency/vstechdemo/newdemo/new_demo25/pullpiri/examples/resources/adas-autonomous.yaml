apiVersion: v1
kind: Scenario
metadata:
  name: autonomous_driving
spec:
  condition:
    express: eq
    value: "\"autonomous\""
    operands:
      type: DDS
      name: driving_mode
      value: CarMode
  action: update
  target: autonomous_driving
---
apiVersion: v1
kind: Package
metadata:
  label: null
  name: autonomous_driving
spec:
  pattern:
    - type: plain
  models:
    - name: autonomous_driving
      node: localhost
      resources:
        volume:                    
        network:                  
---
apiVersion: v1
kind: Model
metadata:
  name: autonomous_driving
  annotations:
    io.piccolo.annotations.package-type: autonomous-driving
    io.piccolo.annotations.package-name: autonomous_driving
    io.piccolo.annotations.package-network: default
  labels:
    app: autonomous-driving
spec:
  hostNetwork: true
  containers:
    - name: autonomous-threshold-manager
      image: threshold-autonomous:latest
      command: ["python3", "/app/threshold_manager.py", "--obstacle", "5.0", "--risk", "90.0", "--brake", "85.0", "--speed-max", "120.0", "--speed-min", "10.0", "--steering", "30.0"]
      volumeMounts:
        - name: thresholds-volume
          mountPath: /data
  volumes:
    - name: thresholds-volume
      hostPath:
        path: /root/pre_demo/executables
        type: Directory
  terminationGracePeriodSeconds: 0
  restartPolicy: Never